<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">CmdIME</title>
  <desc id="desc">CmdIME 给每个输入法一个专属按键：左 Command 切到英文，右 Command 切到中文，右 Shift 切到日文。</desc>
  <defs>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F2F37"/>
      <stop offset="1" stop-color="#1D1D22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0F1014"/>
  <path d="M640 64 V336" stroke="#26272E" stroke-width="1"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#7F7F8A">macOS 输入法切换工具</text>
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="84" font-weight="700" fill="#F4F4F6">CmdIME</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="32" font-weight="600" fill="#F4F4F6">每个输入法，一个专属键。</text>
    <text x="0" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="32" fill="#B9B9C3">不用轮流切换，也不用猜。</text>
    <text x="0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7F7F8A">Swift · macOS 13+ · MIT</text>
  </g>

  <g id="row-1" transform="translate(700 64)">
    <rect width="132" height="72" rx="14" fill="url(#keycap)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="46" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="34" fill="#F4F4F6">⌘</text>
    <text x="100" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#B9B9C3">L</text>
    <path d="M150 36 H226" stroke="#5A5B66" stroke-width="2" stroke-linecap="round"/>
    <path d="M218 28 L228 36 L218 44" fill="none" stroke="#5A5B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" width="192" height="72" rx="16" fill="#4D8CFF" fill-opacity="0.14" stroke="#4D8CFF" stroke-opacity="0.55"/>
    <rect x="256" y="12" width="48" height="48" rx="11" fill="#4D8CFF"/>
    <text x="280" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">A</text>
    <text x="320" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="600" fill="#F4F4F6">English</text>
  </g>
  <g id="row-2" transform="translate(700 160)">
    <rect width="132" height="72" rx="14" fill="url(#keycap)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="46" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="34" fill="#F4F4F6">⌘</text>
    <text x="100" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#B9B9C3">R</text>
    <path d="M150 36 H226" stroke="#5A5B66" stroke-width="2" stroke-linecap="round"/>
    <path d="M218 28 L228 36 L218 44" fill="none" stroke="#5A5B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" width="192" height="72" rx="16" fill="#33A854" fill-opacity="0.14" stroke="#33A854" stroke-opacity="0.55"/>
    <rect x="256" y="12" width="48" height="48" rx="11" fill="#33A854"/>
    <text x="280" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">中</text>
    <text x="320" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="600" fill="#F4F4F6">中文</text>
  </g>
  <g id="row-3" transform="translate(700 256)">
    <rect width="132" height="72" rx="14" fill="url(#keycap)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="46" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="34" fill="#F4F4F6">⇧</text>
    <text x="100" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#B9B9C3">R</text>
    <path d="M150 36 H226" stroke="#5A5B66" stroke-width="2" stroke-linecap="round"/>
    <path d="M218 28 L228 36 L218 44" fill="none" stroke="#5A5B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" width="192" height="72" rx="16" fill="#E3574A" fill-opacity="0.14" stroke="#E3574A" stroke-opacity="0.55"/>
    <rect x="256" y="12" width="48" height="48" rx="11" fill="#E3574A"/>
    <text x="280" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">あ</text>
    <text x="320" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="600" fill="#F4F4F6">日本語</text>
  </g>
</svg>
